StylesPath = styles
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip
Vocab = JPE
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Vale, JPE, ai-tells
# Off: these fire on the owner's real sent writing (labelled bullets, semicolons, lists).
ai-tells.ColonUsage = NO
ai-tells.SemicolonUsage = NO
ai-tells.VerbTricolon = NO
ai-tells.NounString = NO
ai-tells.SelfReference = NO
ai-tells.FigurativeCarries = warning

[voice.md]
BasedOnStyles = Vale
