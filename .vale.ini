StylesPath = styles
Packages = Microsoft, Readability, https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip
Vocab = JacobPEvans
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Vale, JacobPEvans, ai-tells
# Off: these fire on the owner's real sent writing (labelled bullets, semicolons, lists).
ai-tells.ColonUsage = NO
ai-tells.SemicolonUsage = NO
ai-tells.VerbTricolon = NO
ai-tells.NounString = NO
ai-tells.SelfReference = NO
ai-tells.FigurativeCarries = warning
# Single package rules, enabled without loading the whole package.
Microsoft.Acronyms = error
Microsoft.SentenceLength = warning
Readability.FleschKincaid = warning

[voice.md]
BasedOnStyles = Vale
Microsoft.Acronyms = NO
