name: Release assets

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release-assets.yml
      - styles/**

permissions: {}

jobs:
  package:
    name: Package JacobPEvans.zip
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build JacobPEvans.zip
        run: git archive --format=zip --prefix=JacobPEvans/ --output=JacobPEvans.zip HEAD styles/JacobPEvans styles/config/vocabularies/JacobPEvans

      # One rolling release named latest, no version numbers.
      - name: Publish JacobPEvans.zip to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title latest --notes "Vale package built from main." --target "$GITHUB_SHA"
          gh release upload latest JacobPEvans.zip --clobber

      # v1 is the only version tag. It follows main and is never bumped.
      - name: Move the v1 tag to main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1" -f sha="$GITHUB_SHA" -F force=true
